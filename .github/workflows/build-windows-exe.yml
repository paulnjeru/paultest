name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["work", "main", "master"]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download bundled images
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Invoke-WebRequest -Uri "https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/Dell_Servers.jpg/1280px-Dell_Servers.jpg" -OutFile "assets/hero.jpg"
          Invoke-WebRequest -Uri "https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Laptop_and_mouse.jpg/1280px-Laptop_and_mouse.jpg" -OutFile "assets/inventory.jpg"

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm --windowed --onefile --name ITInventoryHub --add-data "assets;assets" run.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITInventoryHub-windows-exe
          path: dist/ITInventoryHub.exe
          if-no-files-found: error
